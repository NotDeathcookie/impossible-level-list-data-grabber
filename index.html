<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ILL Top Levels</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    h1 { color: #333; }
    pre { background: #272822; color: #f8f8f2; padding: 15px; border-radius: 5px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Impossible Levels List (ILL) Data</h1>
  <p>Raw data loaded directly from <code>ill_top2000.csv</code>:</p>
  <pre id="data-container">Loading data...</pre>

  <script>
    fetch('ill_top2000.csv')
      .then(response => response.text())
      .then(data => {
        document.getElementById('data-container').textContent = data;
      })
      .catch(err => {
        document.getElementById('data-container').textContent = 'Error loading data.';
      });
  </script>
</body>
</html>
